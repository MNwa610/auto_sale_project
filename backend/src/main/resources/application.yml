spring:
  application:
    name: carmarket-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auto_sale_kr3}
    username: ${DB_USER:carmarket}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-migration-naming: true
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

carmarket:
  auth:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: carmarket
    access-ttl: PT10M
    refresh-ttl: P7D
    max-failed-attempts: 5
    lock-duration: PT15M
    failure-window: PT15M
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    login: ${BOOTSTRAP_ADMIN_LOGIN:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
