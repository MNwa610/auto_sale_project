server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
